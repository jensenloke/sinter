name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bun run typecheck

      - name: Type-check Cloud
        run: bun run typecheck:cloud

      - name: Build CLI
        run: bun run build:cli

      - name: Build Cloud
        run: bun run build:cloud

      - name: Smoke built entrypoint
        run: bun packages/cli/dist/main.js --version

      - name: Rehearse global package install
        run: bun run verify:package

  database:
    name: Verify database policies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase start

      - name: Run pgTAP tests
        run: bunx supabase test db

      - name: Stop local Supabase
        if: always()
        run: bunx supabase stop
